name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collector - PowerShell 7
        shell: pwsh
        run: ./tests/diff.Tests.ps1
      - name: Installer - PowerShell 7
        shell: pwsh
        run: ./tests/install.Tests.ps1
      - name: Summary - PowerShell 7
        shell: pwsh
        run: ./tests/summary.Tests.ps1
      - name: Summary - Windows PowerShell 5.1
        shell: powershell
        run: ./tests/summary.Tests.ps1
      - name: Collector - Windows PowerShell 5.1
        shell: powershell
        run: ./tests/diff.Tests.ps1
      - name: Installer - Windows PowerShell 5.1
        shell: powershell
        run: ./tests/install.Tests.ps1
